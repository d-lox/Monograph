<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monograph</title>
    <style>
        :root {
            --bg-color: #f4f1ea; --paper-color: #fdfcf8; --text-color: #2c2c2c; --accent-color: #8b4513; --key-bg: #e0dcd3; --key-shadow: #b0aba2; --key-active: #d0ccc3;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column;
            height: 100vh; overflow: hidden; transition: background-color 0.3s;
        }
        body.night-mode { --bg-color: #1a1a1a; --paper-color: #222; --text-color: #ffcc00; --key-bg: #333; --key-shadow: #111; }
        #paper-container {
            flex: 1; overflow-y: auto; padding: 20px 15px 150px 15px;
            background-color: var(--paper-color); margin: 10px; border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1); transition: background-color 0.3s;
            display: flex; flex-direction: column-reverse;
        }
        #text-content {
            white-space: pre-wrap; word-wrap: break-word; outline: none; font-size: 1.2rem;
            line-height: 1.6; flex-grow: 1; min-height: 100%; caret-color: var(--accent-color);
        }
        #text-content:empty:before { content: "Start typing..."; color: #999; pointer-events: none; }
        #keyboard {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--key-bg);
            padding: 8px 5px 20px 5px; display: flex; flex-direction: column; gap: 6px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1); transition: transform 0.3s, background 0.3s;
            z-index: 100; border-top: 2px solid var(--key-shadow);
        }
        .key-row { display: flex; justify-content: center; gap: 5px; padding: 0 5px; }
        .key {
            background: var(--paper-color); border-radius: 6px; border: 1px solid var(--key-shadow);
            box-shadow: 0 3px 0 var(--key-shadow); color: var(--text-color); font-family: 'Courier New', monospace;
            font-size: 1.1rem; font-weight: bold; height: 45px; flex: 1; max-width: 60px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.05s; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); background: var(--key-active); }
        .key.special { background: var(--bg-color); font-size: 0.9rem; flex: 1.5; }
        .key.space { flex: 3; max-width: none; }
        #toolbar { display: flex; justify-content: space-between; padding: 10px 15px; background: var(--bg-color); }
        .btn {
            background: var(--paper-color); border: 1px solid var(--key-shadow); padding: 8px 16px;
            border-radius: 20px; font-family: monospace; font-weight: bold; color: var(--text-color);
            cursor: pointer; box-shadow: 0 2px 0 var(--key-shadow); font-size: 0.9rem;
        }
        .btn:active { transform: translateY(1px); box-shadow: none; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button class="btn" id="night-mode-btn">💡 Night Light</button>
        <button class="btn" id="clear-btn">🗑️ Clear</button>
    </div>
    <div id="paper-container">
        <div id="text-content" contenteditable="true" spellcheck="false"></div>
    </div>
    <div id="keyboard">
        <div class="key-row">
            <div class="key" data-key="q">q</div><div class="key" data-key="w">w</div><div class="key" data-key="e">e</div>
            <div class="key" data-key="r">r</div><div class="key" data-key="t">t</div><div class="key" data-key="y">y</div>
            <div class="key" data-key="u">u</div><div class="key" data-key="i">i</div><div class="key" data-key="o">o</div>
            <div class="key" data-key="p">p</div>
        </div>
        <div class="key-row">
            <div class="key" data-key="a">a</div><div class="key" data-key="s">s</div><div class="key" data-key="d">d</div>
            <div class="key" data-key="f">f</div><div class="key" data-key="g">g</div><div class="key" data-key="h">h</div>
            <div class="key" data-key="j">j</div><div class="key" data-key="k">k</div><div class="key" data-key="l">l</div>
        </div>
        <div class="key-row">
            <div class="key special" data-key="shift">⇧</div>
            <div class="key" data-key="z">z</div><div class="key" data-key="x">x</div><div class="key" data-key="c">c</div>
            <div class="key" data-key="v">v</div><div class="key" data-key="b">b</div><div class="key" data-key="n">n</div>
            <div class="key" data-key="m">m</div>
            <div class="key special" data-key="backspace">⌫</div>
        </div>
        <div class="key-row">
            <div class="key special" data-key="123">123</div>
            <div class="key space" data-key=" "> </div>
            <div class="key special" data-key="return">↵</div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const content = document.getElementById('text-content');
            const paperContainer = document.getElementById('paper-container');
            const keys = document.querySelectorAll('.key');
            const nightBtn = document.getElementById('night-mode-btn');
            const clearBtn = document.getElementById('clear-btn');
            let isShift = false;

            function triggerFeedback() {
                if (navigator.vibrate) navigator.vibrate(10);
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.05);
                } catch (e) {}
            }

            keys.forEach(key => {
                const handleKeyPress = (e) => {
                    e.preventDefault();
                    triggerFeedback();
                    const keyVal = key.getAttribute('data-key');
                    if (keyVal === 'shift') {
                        isShift = !isShift;
                        keys.forEach(k => {
                            const kv = k.getAttribute('data-key');
                            if (kv.length === 1 && kv.match(/[a-z]/i)) {
                                k.textContent = isShift ? kv.toUpperCase() : kv.toLowerCase();
                            }
                        });
                    } else if (keyVal === 'backspace') {
                        document.execCommand('delete', false, null);
                    } else if (keyVal === 'return') {
                        document.execCommand('insertText', false, '\n');
                    } else if (keyVal === ' ') {
                        document.execCommand('insertText', false, ' ');
                    } else {
                        let char = keyVal;
                        if (isShift) { char = char.toUpperCase(); isShift = false; }
                        document.execCommand('insertText', false, char);
                    }
                    localStorage.setItem('monograph_draft', content.innerText);
                    paperContainer.scrollTop = paperContainer.scrollHeight;
                };
                key.addEventListener('touchstart', handleKeyPress);
                key.addEventListener('mousedown', handleKeyPress);
            });

            nightBtn.addEventListener('click', () => document.body.classList.toggle('night-mode'));
            clearBtn.addEventListener('click', () => {
                if(confirm("Clear all text?")) { content.innerText = ''; localStorage.setItem('monograph_draft', ''); }
            });
            content.addEventListener('focus', () => content.blur());
            
            const saved = localStorage.getItem('monograph_draft');
            if (saved) content.innerText = saved;
        });
    </script>
</body>
</html>
